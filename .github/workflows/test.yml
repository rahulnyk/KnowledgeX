name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Claude Desktop runs on macOS and Windows. Building needs Node 22 or newer.
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: macos-latest, node: 22 }
          - { os: windows-latest, node: 22 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  extension:
    name: Build the Claude Desktop extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run pack:mcpb
      - uses: actions/upload-artifact@v4
        with:
          name: KnowledgeX.mcpb
          path: KnowledgeX.mcpb
      # The extension runs on the Node that ships with Claude Desktop, which may be older than the build Node.
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Start the extension on Node 18
        run: ./.github/smoke-extension.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Start the extension on Node 20
        run: ./.github/smoke-extension.sh

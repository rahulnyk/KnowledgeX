name: Release

# Push a version tag (for example v0.2.0) to publish a GitHub release with KnowledgeX.mcpb attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Check the tag matches the version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in package.json"
            exit 1
          fi
      - run: pnpm run pack:mcpb
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a suffix, such as v0.3.0-rc.1, is a pre-release. GitHub never marks pre-releases as latest,
          # so the README's download link keeps serving the last stable version.
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" KnowledgeX.mcpb \
            --verify-tag \
            "${prerelease[@]}" \
            --title "KnowledgeX $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "**Install in Claude Desktop:** download KnowledgeX.mcpb below and double-click it. See the [walkthrough](https://github.com/rahulnyk/KnowledgeX/blob/main/docs/walkthrough.md)."

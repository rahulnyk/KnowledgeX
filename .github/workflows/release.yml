name: Release

# Push a version tag (for example v0.3.0) to publish the npm package and a GitHub release with KnowledgeX.mcpb attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # let npm verify this workflow (trusted publishing), so no npm token is stored

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Check the tag matches the version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in package.json"
            exit 1
          fi
      - run: pnpm run pack:mcpb
      - name: Publish to npm
        run: |
          # Trusted publishing needs npm 11.5.1 or newer; provenance is added automatically.
          npm install -g npm@^11.5.1
          version=$(node -p "require('./package.json').version")
          if npm view "knowledgex@$version" version >/dev/null 2>&1; then
            echo "knowledgex@$version is already on npm; skipping."
            exit 0
          fi
          # A tag with a suffix, such as v0.3.0-rc.1, goes to the "next" tag, so `npm install knowledgex` stays on the stable version.
          dist_tag=latest
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then dist_tag=next; fi
          npm publish --access public --tag "$dist_tag"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "The GitHub release $GITHUB_REF_NAME already exists; skipping."
            exit 0
          fi
          # A tag with a suffix is a pre-release. GitHub never marks pre-releases as latest,
          # so the README's download link keeps serving the last stable version.
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" KnowledgeX.mcpb \
            --verify-tag \
            "${prerelease[@]}" \
            --title "KnowledgeX $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "**Install in Claude Desktop:** download KnowledgeX.mcpb below and double-click it. See the [walkthrough](https://github.com/rahulnyk/KnowledgeX/blob/main/docs/walkthrough.md). **Command line and other AI apps:** \`npm install -g knowledgex\`."
